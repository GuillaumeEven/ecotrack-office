<div class="login-container">
  <div class="login-card">
    <!-- Logo -->
    <div class="login-header">
      <h1>EcoTrack Office</h1>
      <p>Accede a tu cuenta</p>
    </div>

    <!-- Card -->
    <div class="card">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            [class.border-error]="form.get('email')?.invalid && form.get('email')?.touched"
          />
          <p
            *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
            class="error-message"
          >
            Por favor, introduce un correo electrónico válido.
          </p>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input
            type="password"
            formControlName="password"
            placeholder="••••••••"
            [class.border-error]="form.get('password')?.invalid && form.get('password')?.touched"
          />
          <p
            *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
            class="error-message"
          >
            Por favor, introduce una contraseña.
          </p>
        </div>

        <!-- Error message -->
        <div *ngIf="errorMessage" class="auth-error">✕ {{ errorMessage }}</div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="form.invalid || isLoading"
          class="btn btn-primary btn-block"
        >
          {{ isLoading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </button>
      </form>
    </div>
  </div>
</div>
