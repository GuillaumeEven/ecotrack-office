<div class="login-container">
  <div class="login-card">
    <!-- Logo -->
    <div class="login-header">
      <h1>EcoTrack Office</h1>
      <p>Sign in to your account</p>
    </div>

    <!-- Card -->
    <div class="card">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="form-group">
          <label>Email Address</label>
          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            [class.border-error]="form.get('email')?.invalid && form.get('email')?.touched"
          />
          <p
            *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
            class="error-message"
          >
            Please enter a valid email.
          </p>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            formControlName="password"
            placeholder="••••••••"
            [class.border-error]="form.get('password')?.invalid && form.get('password')?.touched"
          />
          <p
            *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
            class="error-message"
          >
            Password is required.
          </p>
        </div>

        <!-- Error message -->
        <div *ngIf="errorMessage" class="auth-error">✕ {{ errorMessage }}</div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="form.invalid || isLoading"
          class="submit-btn"
        >
          {{ isLoading ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
    </div>
  </div>
</div>
