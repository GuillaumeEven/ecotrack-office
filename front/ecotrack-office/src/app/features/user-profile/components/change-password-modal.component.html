<div class="modal-overlay" (click)="onClose()">
  <div class="modal" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <h3 class="modal-title">Cambiar contraseña</h3>
      <button class="modal-close" (click)="onClose()" [disabled]="isLoading">✕</button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Current password -->
        <div class="form-group">
          <label>CONTRASEÑA ACTUAL</label>
          <input
            type="password"
            formControlName="currentPassword"
            [class.error]="form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched"
          />
          <p *ngIf="form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched" class="form-error">
            Introduce la contraseña actual.
          </p>
        </div>

        <!-- New password -->
        <div class="form-group">
          <label>NUEVA CONTRASEÑA</label>
          <input
            type="password"
            formControlName="newPassword"
            [class.error]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched"
          />
          <p *ngIf="form.get('newPassword')?.hasError('required') && form.get('newPassword')?.touched" class="form-error">
            Introduce la nueva contraseña.
          </p>
          <p *ngIf="form.get('newPassword')?.hasError('minlength') && form.get('newPassword')?.touched" class="form-error">
            La contraseña tiene que tener al menos 8 caracteres.
          </p>
        </div>

        <!-- Confirm password -->
        <div class="form-group">
          <label>REPITE LA NUEVA CONTRASEÑA</label>
          <input
            type="password"
            formControlName="confirmPassword"
            [class.error]="form.get('confirmPassword')?.touched && form.hasError('mismatch')"
          />
          <p *ngIf="form.get('confirmPassword')?.touched && form.hasError('mismatch')" class="form-error">
            Las contraseñas no coinciden.
          </p>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button type="button" (click)="onClose()" class="btn btn-outline" [disabled]="isLoading">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isLoading">
            {{ isLoading ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
