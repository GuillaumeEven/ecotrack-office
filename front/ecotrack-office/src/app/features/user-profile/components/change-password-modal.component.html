<div class="modal-overlay" (click)="onClose()">
  <div class="modal" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <h3 class="modal-title">Change Password</h3>
      <button class="modal-close" (click)="onClose()" [disabled]="isLoading">✕</button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Current password -->
        <div class="form-group">
          <label>CURRENT PASSWORD</label>
          <input
            type="password"
            formControlName="currentPassword"
            [class.error]="form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched"
          />
          <p *ngIf="form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched" class="form-error">
            Current password is required.
          </p>
        </div>

        <!-- New password -->
        <div class="form-group">
          <label>NEW PASSWORD</label>
          <input
            type="password"
            formControlName="newPassword"
            [class.error]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched"
          />
          <p *ngIf="form.get('newPassword')?.hasError('required') && form.get('newPassword')?.touched" class="form-error">
            New password is required.
          </p>
          <p *ngIf="form.get('newPassword')?.hasError('minlength') && form.get('newPassword')?.touched" class="form-error">
            Password must be at least 8 characters.
          </p>
        </div>

        <!-- Confirm password -->
        <div class="form-group">
          <label>CONFIRM NEW PASSWORD</label>
          <input
            type="password"
            formControlName="confirmPassword"
            [class.error]="form.get('confirmPassword')?.touched && form.hasError('mismatch')"
          />
          <p *ngIf="form.get('confirmPassword')?.touched && form.hasError('mismatch')" class="form-error">
            Passwords do not match.
          </p>
        </div>

        <!-- Feedback -->
        <div class="feedback-section">
          <p *ngIf="successMessage" class="success-message">✓ {{ successMessage }}</p>
          <p *ngIf="errorMessage" class="error-message">✕ {{ errorMessage }}</p>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button type="button" (click)="onClose()" class="btn btn-cancel" [disabled]="isLoading">
            Cancel
          </button>
          <button type="submit" class="btn btn-submit" [disabled]="form.invalid || isLoading">
            {{ isLoading ? 'Saving...' : 'Save' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
