<!-- Backdrop -->
<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center" (click)="onClose()">
  <!-- Modal (stopPropagation evita que el click en el modal cierre el backdrop) -->
  <div
    class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md w-full max-w-md mx-md shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between mb-lg border-b border-outline-variant pb-sm">
      <h3 class="font-headline-md text-headline-md text-on-surface">Change Password</h3>
      <button
        (click)="onClose()"
        class="text-on-surface-variant hover:text-on-surface transition-colors"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-md">
      <!-- Current password -->
      <div class="space-y-xs">
        <label class="text-on-surface font-label-sm text-label-sm block">CURRENT PASSWORD</label>
        <input
          type="password"
          formControlName="currentPassword"
          class="w-full bg-surface border border-outline-variant rounded-xl p-sm focus:ring-2 focus:ring-on-tertiary-container focus:border-transparent transition-all outline-none"
          [class.border-error]="
            form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched
          "
        />
        <p
          *ngIf="form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched"
          class="text-error text-[12px]"
        >
          Current password is required.
        </p>
      </div>

      <!-- New password -->
      <div class="space-y-xs">
        <label class="text-on-surface font-label-sm text-label-sm block">NEW PASSWORD</label>
        <input
          type="password"
          formControlName="newPassword"
          class="w-full bg-surface border border-outline-variant rounded-xl p-sm focus:ring-2 focus:ring-on-tertiary-container focus:border-transparent transition-all outline-none"
          [class.border-error]="
            form.get('newPassword')?.invalid && form.get('newPassword')?.touched
          "
        />
        <p
          *ngIf="form.get('newPassword')?.hasError('required') && form.get('newPassword')?.touched"
          class="text-error text-[12px]"
        >
          New password is required.
        </p>
        <p
          *ngIf="form.get('newPassword')?.hasError('minlength') && form.get('newPassword')?.touched"
          class="text-error text-[12px]"
        >
          Password must be at least 8 characters.
        </p>
      </div>

      <!-- Confirm password -->
      <div class="space-y-xs">
        <label class="text-on-surface font-label-sm text-label-sm block"
          >CONFIRM NEW PASSWORD</label
        >
        <input
          type="password"
          formControlName="confirmPassword"
          class="w-full bg-surface border border-outline-variant rounded-xl p-sm focus:ring-2 focus:ring-on-tertiary-container focus:border-transparent transition-all outline-none"
          [class.border-error]="form.get('confirmPassword')?.touched && form.hasError('mismatch')"
        />
        <p
          *ngIf="form.get('confirmPassword')?.touched && form.hasError('mismatch')"
          class="text-error text-[12px]"
        >
          Passwords do not match.
        </p>
      </div>

      <!-- Feedback -->
      <div>
        <p *ngIf="successMessage" class="text-secondary text-[13px] font-medium">
          ✓ {{ successMessage }}
        </p>
        <p *ngIf="errorMessage" class="text-error text-[13px] font-medium">✕ {{ errorMessage }}</p>
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-sm pt-sm">
        <button
          type="button"
          (click)="onClose()"
          class="px-lg py-sm text-on-surface-variant border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors font-bold"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="form.invalid || isLoading"
          class="px-lg py-sm bg-primary text-on-primary rounded-xl hover:opacity-90 transition-all active:scale-95 font-bold disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ isLoading ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
