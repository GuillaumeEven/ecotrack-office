<aside>

  <nav>
    <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="router-link-active"
      [routerLinkActiveOptions]="{ exact: true }">
      <span class="material-symbols-outlined">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a>
  </nav>


</aside>
