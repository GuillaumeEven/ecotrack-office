  <!-- Bento Grid -->
  <div class="grid grid-cols-12 gap-gutter">
    <!-- LEFT COLUMN: Identity card + Quick nav -->
    <div class="col-span-12 md:col-span-4 flex flex-col gap-gutter">
      <!-- Identity card -->
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
        <div class="flex flex-col items-center text-center">
          <!-- Avatar with upload button -->
          <div class="relative group cursor-pointer mb-md" (click)="onChangePhoto()">
            <img
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuDnHu9QB7UKbkPpUnc2e48oUrKYZyVqH_Fafdqai4PKK7eO79-an2Uhq9UNwtbNRA9ag9one6kkuqN-VAel9wHbJT5L-ks_oCU2kG0SL244tTKAxYIFs2baTBJdIDLROWy4h0KO9ccsahkXVDSyZyRNHZv-Y3qyPjG4QnSV1R0OhnhyY8l0oQOO86rLLjBF87bPWu6GQhE66cD0EkDBULteYUU-CCdaHM6TPf_CN4n1SIUKupVC6Hccx_4q6L8jj6IKwiDD5jFUYfyf"
              alt="Organization profile photo"
              class="w-32 h-32 rounded-full object-cover border-4 border-surface-container-high shadow-lg transition-transform group-hover:scale-105"
            />
            <div
              class="absolute bottom-0 right-0 bg-primary text-on-primary p-xs rounded-full shadow-md"
            >
              <span class="material-symbols-outlined text-[20px]">photo_camera</span>
            </div>
          </div>

          <div
            *ngIf="isLoading"
            class="h-8 w-40 bg-surface-container-high rounded-xl animate-pulse mb-xs"
          ></div>
          <h2 *ngIf="!isLoading" class="font-headline-md text-headline-md text-on-surface">
            {{ organization?.name }}
          </h2>

          <!-- Meta info -->
          <div class="mt-md w-full pt-md border-t border-outline-variant space-y-sm">
            <div class="flex justify-between items-center px-sm">
              <span class="text-on-surface-variant text-label-sm font-label-sm">REGISTRADA DESDE</span>
              <span class="text-on-surface text-[12px] font-medium">
                {{ organization?.createdAt | date: 'MMMM yyyy' }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Forms -->
    <div class="col-span-12 md:col-span-8 space-y-gutter">
      <!-- Personal Information Form -->
      <div
        class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md"
      >
        <div class="flex items-center justify-between mb-lg border-b border-outline-variant pb-sm">
          <h3 class="font-headline-md text-headline-md text-on-surface">Información de empresa</h3>
          <span class="material-symbols-outlined text-on-surface-variant">edit</span>
        </div>

        <form
          [formGroup]="profileForm"
          (ngSubmit)="onSaveChanges()"
          class="grid grid-cols-1 md:grid-cols-2 gap-md"
        >
          <!-- NOMBRE -->
          <div class="space-y-xs">
            <label class="text-on-surface font-label-sm text-label-sm block">NOMBRE</label>
            <input
              type="text"
              formControlName="name"
              class="w-full bg-surface border border-outline-variant rounded-xl p-sm focus:ring-2 focus:ring-on-tertiary-container focus:border-transparent transition-all outline-none"
              [class.border-error]="
                profileForm.get('name')?.invalid && profileForm.get('name')?.touched
              "
            />
            <p
              *ngIf="profileForm.get('name')?.invalid && profileForm.get('name')?.touched"
              class="text-error text-[12px]"
            >
              El nombre es necesario.
            </p>
          </div>

          <!-- CIF -->
          <div class="space-y-xs">
            <label class="text-on-surface font-label-sm text-label-sm block">CIF</label>
            <input
              type="text"
              formControlName="cif"
              class="w-full bg-surface border border-outline-variant rounded-xl p-sm focus:ring-2 focus:ring-on-tertiary-container focus:border-transparent transition-all outline-none"
              [class.border-error]="
                profileForm.get('cif')?.invalid && profileForm.get('cif')?.touched
              "
            />
            <p
              *ngIf="profileForm.get('cif')?.invalid && profileForm.get('cif')?.touched"
              class="text-error text-[12px]"
            >
              El CIF es necesario.
            </p>
          </div>

          <!-- Email -->
          <div class="space-y-xs">
            <label class="text-on-surface font-label-sm text-label-sm block">CORREO ELECTRÓNICA</label>
            <input
              type="email"
              formControlName="email"
              class="w-full bg-surface border border-outline-variant rounded-xl p-sm focus:ring-2 focus:ring-on-tertiary-container focus:border-transparent transition-all outline-none"
              [class.border-error]="
                profileForm.get('email')?.invalid && profileForm.get('email')?.touched
              "
            />
            <p
              *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched"
              class="text-error text-[12px]"
            >
              El correo electrónico es necesario.
            </p>
          </div>

          <!-- DIRECCION -->
          <div class="space-y-xs">
            <label class="text-on-surface font-label-sm text-label-sm block">DIRECCIÓN</label>
            <input
              type="text"
              formControlName="address"
              class="w-full bg-surface border border-outline-variant rounded-xl p-sm focus:ring-2 focus:ring-on-tertiary-container focus:border-transparent transition-all outline-none"
              [class.border-error]="
                profileForm.get('address')?.invalid && profileForm.get('address')?.touched
              "
            />
            <p
              *ngIf="profileForm.get('address')?.invalid && profileForm.get('address')?.touched"
              class="text-error text-[12px]"
            >
              La dirección es necesaria.
            </p>
          </div>

          <!-- Feedback -->
          <div class="col-span-full">
            <p *ngIf="successMessage" class="text-secondary text-[13px] font-medium">
              ✓ {{ successMessage }}
            </p>
            <p *ngIf="errorMessage" class="text-error text-[13px] font-medium">
              ✕ {{ errorMessage }}
            </p>
          </div>

          <!-- Actions -->
          <div class="col-span-full pt-md flex justify-end gap-sm">
            <button
              type="button"
              (click)="onDiscardChanges()"
              class="px-lg py-sm text-on-surface-variant border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors font-bold"
            >
              Descartar cambios
            </button>
            <button
              type="submit"
              [disabled]="profileForm.invalid"
              class="px-lg py-sm bg-primary text-on-primary rounded-xl hover:opacity-90 transition-all active:scale-95 font-bold disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Guardar cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
