name: Build & Test

on:
  push:
    branches:
      - dev
      - main
      - 'feat/**'
  pull_request:
    branches:
      - dev
      - main

jobs:
  # ============================================================================
  # Backend Build & Test
  # ============================================================================
  backend-build:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ecotrack_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./back/ecotrack-office
        run: |
          ./mvnw clean package -B
        env:
          DB_URL: jdbc:mysql://localhost:3306/ecotrack_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-build-artifacts
          path: back/ecotrack-office/target/*.jar
          retention-days: 5

  # ============================================================================
  # Frontend Build & Test
  # ============================================================================
  frontend-build:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./front/ecotrack-office/package-lock.json

      - name: Install dependencies
        working-directory: ./front/ecotrack-office
        run: npm ci

      - name: Run linter
        working-directory: ./front/ecotrack-office
        run: npm run lint 2>/dev/null || echo "Linter not configured, skipping"

      - name: Run tests
        working-directory: ./front/ecotrack-office
        run: npm run test:ci 2>/dev/null || echo "Tests not configured, skipping"

      - name: Build Angular app
        working-directory: ./front/ecotrack-office
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build-artifacts
          path: front/ecotrack-office/dist/
          retention-days: 5

  # ============================================================================
  # Build Success Summary
  # ============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.backend-build.result }}" == "failure" ] || [ "${{ needs.frontend-build.result }}" == "failure" ]; then
            echo "❌ Build failed!"
            exit 1
          fi
          echo "✅ All builds successful!"