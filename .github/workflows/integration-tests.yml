name: Integration Tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  # ============================================================================
  # Integration Tests with Docker Compose
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy environment file
        run: cp .env.dev .env

      - name: Build Docker images
        run: |
          docker-compose build

      - name: Start services
        run: |
          docker-compose up -d
          echo "Waiting for services to be ready..."
          sleep 30

      - name: Check service health
        run: |
          echo "=== Checking MySQL health ==="
          docker-compose exec -T mysql mysqladmin ping -u ecotrack_user -pecotrack_password || exit 1

          echo "=== Checking Backend health ==="
          BACKEND_OK=0
          for i in {1..30}; do
            if docker-compose exec -T backend curl -f http://localhost:8080/actuator/health 2>/dev/null; then
              echo "Backend is healthy"
              BACKEND_OK=1
              break
            fi
            echo "Attempt $i/30: Backend not ready yet..."
            sleep 2
          done
          if [[ "$BACKEND_OK" -ne 1 ]]; then
            echo "❌ Backend did not become healthy in time"
            exit 1
          fi

          echo "=== Checking Frontend health ==="
          FRONTEND_OK=0
          for i in {1..30}; do
            if docker-compose exec -T frontend wget --quiet --tries=1 --spider http://localhost:8080/health 2>/dev/null; then
              echo "Frontend is healthy"
              FRONTEND_OK=1
              break
            fi
            echo "Attempt $i/30: Frontend not ready yet..."
            sleep 2
          done
          if [[ "$FRONTEND_OK" -ne 1 ]]; then
            echo "❌ Frontend did not become healthy in time"
            exit 1
          fi

      - name: Run API tests
        run: |
          echo "=== Testing Backend API ==="

          # Health check
          echo "Testing /actuator/health..."
          docker-compose exec -T backend curl -f http://localhost:8080/actuator/health || exit 1

          # API is running
          echo "API is responding!"

      - name: Run Frontend tests
        run: |
          echo "=== Testing Frontend ==="

          # Frontend is serving
          echo "Testing frontend health endpoint..."
          docker-compose exec -T frontend wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1

          echo "Frontend is responding!"

      - name: Check service logs
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker-compose logs backend | head -50
          echo "=== Frontend logs ==="
          docker-compose logs frontend | head -50
          echo "=== MySQL logs ==="
          docker-compose logs mysql | head -50

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping services..."
          docker-compose down
          echo "Services stopped"

  # ============================================================================
  # Security Scanning (optional)
  # ============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
