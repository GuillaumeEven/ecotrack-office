name: Integration Tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  # ============================================================================
  # Integration Tests with Docker Compose
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare CI environment file
        run: |
          cat > .env << 'EOF'
          DB_NAME=ecotrack
          DB_USERNAME=ecotrack_user
          DB_PASSWORD=ecotrack_password
          MYSQL_ROOT_PASSWORD=root_password
          SPRING_PROFILES_ACTIVE=dev
          JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_EXPIRATION=86400000
          EOF

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 30

      - name: Check service health
        run: |
          echo "=== Checking MySQL health ==="
          docker compose exec -T mysql mysqladmin ping -u ecotrack_user -pecotrack_password || exit 1

          echo "=== Checking Backend health ==="
          backend_ok=false
          for i in {1..30}; do
            if docker compose exec -T backend curl -f http://localhost:8080/actuator/health 2>/dev/null; then
              echo "Backend is healthy"
              backend_ok=true
              break
            fi

            backend_state=$(docker compose ps --format json backend | sed -n 's/.*"State":"\([^"]*\)".*/\1/p' | head -1)
            if [ "$backend_state" = "exited" ] || [ "$backend_state" = "dead" ]; then
              echo "Backend container is $backend_state, failing fast"
              docker compose ps
              docker compose logs backend | tail -200
              exit 1
            fi

            echo "Attempt $i/30: Backend not ready yet..."
            sleep 2
          done

          if [ "$backend_ok" != "true" ]; then
            echo "Backend did not become healthy after retries"
            docker compose ps
            docker compose logs backend | tail -200
            exit 1
          fi

          echo "=== Checking Frontend health ==="
          frontend_ok=false
          for i in {1..30}; do
            if docker compose exec -T frontend wget --quiet --tries=1 --spider http://localhost:8080/health 2>/dev/null; then
              echo "Frontend is healthy"
              frontend_ok=true
              break
            fi

            frontend_state=$(docker compose ps --format json frontend | sed -n 's/.*"State":"\([^"]*\)".*/\1/p' | head -1)
            if [ "$frontend_state" = "exited" ] || [ "$frontend_state" = "dead" ]; then
              echo "Frontend container is $frontend_state, failing fast"
              docker compose ps
              docker compose logs frontend | tail -200
              exit 1
            fi

            echo "Attempt $i/30: Frontend not ready yet..."
            sleep 2
          done

          if [ "$frontend_ok" != "true" ]; then
            echo "Frontend did not become healthy after retries"
            docker compose ps
            docker compose logs frontend | tail -200
            exit 1
          fi

      - name: Run API tests
        run: |
          echo "=== Testing Backend API ==="

          # Health check
          echo "Testing /actuator/health..."
          code=$(docker compose exec -T backend sh -lc "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true")
          if [ "$code" = "200" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "Backend health endpoint reachable with status $code"
          else
            echo "Unexpected status from backend health endpoint: $code"
            exit 1
          fi

          # API is running
          echo "API is responding!"

      - name: Run Frontend tests
        run: |
          echo "=== Testing Frontend ==="

          # Frontend may take a bit longer to boot; retry before failing.
          echo "Testing frontend health endpoint..."
          frontend_ok=false
          for i in {1..30}; do
            code=$(docker compose exec -T frontend sh -lc "wget -qO- --server-response http://127.0.0.1:8080/health 2>&1 | awk '/^  HTTP\// {print \$2}' | tail -1" || true)
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
              echo "Frontend health endpoint reachable with status $code"
              frontend_ok=true
              break
            fi
            echo "Attempt $i/30: Frontend not ready yet (status: ${code:-N/A})..."
            sleep 2
          done

          if [ "$frontend_ok" != "true" ]; then
            echo "Frontend failed health check after retries"
            docker compose ps
            docker compose logs frontend | tail -200
            exit 1
          fi

          echo "Frontend is responding!"

      - name: Check service logs
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker compose logs backend | head -50
          echo "=== Frontend logs ==="
          docker compose logs frontend | head -50
          echo "=== MySQL logs ==="
          docker compose logs mysql | head -50

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping services..."
          docker compose down
          echo "Services stopped"

  # ============================================================================
  # Security Scanning (optional)
  # ============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          # Use only misconfiguration checks to avoid external Maven lookups/rate limits in CI.
          scanners: 'misconfig'
          # Legacy compatibility with older trivy-action versions.
          security-checks: 'config'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'