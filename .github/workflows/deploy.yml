name: Deploy to 02 Switch

on:
  push:
    branches:
      - deploy
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/ecotrack-backend
  FRONTEND_IMAGE: ${{ github.repository }}/ecotrack-frontend

jobs:
  # ============================================================================
  # Determine Environment
  # ============================================================================
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      deploy_host: ${{ steps.env.outputs.deploy_host }}
      deploy_user: ${{ steps.env.outputs.deploy_user }}

    steps:
      - name: Determine environment
        id: env
        run: |
          # Default: deploy branch → production
          # Can override via workflow_dispatch input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          else
            ENVIRONMENT="production"
          fi

          if [[ "$ENVIRONMENT" == "production" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
            echo "deploy_user=${{ secrets.DEPLOY_USER_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "deploy_host=${{ secrets.DEPLOY_HOST_STAGING }}" >> $GITHUB_OUTPUT
            echo "deploy_user=${{ secrets.DEPLOY_USER_STAGING }}" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # Pre-Deployment Checks
  # ============================================================================
  pre-deploy:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker-compose config -f docker-compose.prod.yml > /dev/null || exit 1
          echo "✅ docker-compose.prod.yml is valid"

      - name: Validate required secrets
        run: |
          if [[ -z "${{ secrets.DEPLOY_KEY }}" ]]; then
            echo "❌ DEPLOY_KEY secret not set"
            exit 1
          fi
          if [[ -z "${{ secrets.DB_PASSWORD }}" ]]; then
            echo "❌ DB_PASSWORD secret not set"
            exit 1
          fi
          if [[ -z "${{ secrets.JWT_SECRET }}" ]]; then
            echo "❌ JWT_SECRET secret not set"
            exit 1
          fi
          echo "✅ All required secrets are configured"

  # ============================================================================
  # Deploy to Server
  # ============================================================================
  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, pre-deploy]
    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ needs.setup.outputs.deploy_host }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create deployment directory
        run: |
          ssh -i ~/.ssh/deploy_key ${{ needs.setup.outputs.deploy_user }}@${{ needs.setup.outputs.deploy_host }} \
            "mkdir -p ~/ecotrack-office && cd ~/ecotrack-office"

      - name: Copy docker-compose files
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            .env.prod \
            deployment/deploy.sh \
            deployment/backup.sh \
            ${{ needs.setup.outputs.deploy_user }}@${{ needs.setup.outputs.deploy_host }}:~/ecotrack-office/

      - name: Execute deployment script
        run: |
          ssh -i ~/.ssh/deploy_key ${{ needs.setup.outputs.deploy_user }}@${{ needs.setup.outputs.deploy_host }} \
            "cd ~/ecotrack-office && \
             bash deploy.sh \
               --registry=${{ env.REGISTRY }} \
               --backend-image=${{ env.BACKEND_IMAGE }} \
               --frontend-image=${{ env.FRONTEND_IMAGE }} \
               --version=${{ github.sha }} \
               --environment=${{ needs.setup.outputs.environment }}"

      - name: Health check post-deploy
        run: |
          echo "Waiting for services to stabilize..."
          sleep 10

          # Check backend
          for i in {1..30}; do
            if ssh -i ~/.ssh/deploy_key ${{ needs.setup.outputs.deploy_user }}@${{ needs.setup.outputs.deploy_host }} \
              "curl -f http://localhost:8080/actuator/health 2>/dev/null"; then
              echo "✅ Backend is healthy"
              break
            fi
            echo "Attempt $i/30: Backend not ready..."
            sleep 2
          done

          # Check frontend
          for i in {1..30}; do
            if ssh -i ~/.ssh/deploy_key ${{ needs.setup.outputs.deploy_user }}@${{ needs.setup.outputs.deploy_host }} \
              "curl -f http://localhost/health 2>/dev/null"; then
              echo "✅ Frontend is healthy"
              break
            fi
            echo "Attempt $i/30: Frontend not ready..."
            sleep 2
          done

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

  # ============================================================================
  # Rollback on Failure
  # ============================================================================
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: failure()

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ needs.setup.outputs.deploy_host }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Execute rollback
        run: |
          ssh -i ~/.ssh/deploy_key ${{ needs.setup.outputs.deploy_user }}@${{ needs.setup.outputs.deploy_host }} \
            "cd ~/ecotrack-office && docker-compose -f docker-compose.prod.yml down && docker-compose -f docker-compose.prod.yml up -d"
          echo "⚠️ Rollback executed! Check the previous version."

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

  # ============================================================================
  # Post-Deployment Notification
  # ============================================================================
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: always()

    steps:
      - name: Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment: ${{ needs.setup.outputs.environment }} - ${{ job.status }}
            Commit: ${{ github.sha }}
            Ref: ${{ github.ref_name }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
