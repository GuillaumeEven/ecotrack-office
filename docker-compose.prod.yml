version: '3.9'

services:
  # ============================================================================
  # MySQL Database (Production)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: ecotrack-mysql-prod
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ecotrack}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    ports:
      - "3306:3306"
    volumes:
      # Init database with schema (read-only)
      - ./back/ecotrack-office/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Persist data in named volume
      - mysql_data_prod:/var/lib/mysql
    networks:
      - ecotrack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # Spring Boot Backend (Production)
  # ============================================================================
  backend:
    build:
      context: ./back/ecotrack-office
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY}ecotrack-backend:${VERSION:-latest}
    container_name: ecotrack-backend-prod
    environment:
      # Database configuration
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      
      # Spring configuration
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      
      # JWT configuration (MUST be set from secrets)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      
      # API configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_EDIAE: INFO
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecotrack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # No volumes in production (image is final)

  # ============================================================================
  # Angular Frontend (Nginx) - Production
  # ============================================================================
  frontend:
    build:
      context: ./front/ecotrack-office
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY}ecotrack-frontend:${VERSION:-latest}
    container_name: ecotrack-frontend-prod
    environment:
      ANGULAR_API_URL: ${ANGULAR_API_URL}
      API_BASE_URL: ${API_BASE_URL}
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - ecotrack-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

# ============================================================================
# Networks
# ============================================================================
networks:
  ecotrack-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  mysql_data_prod:
    driver: local
