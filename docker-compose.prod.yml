services:
  mysql:
    image: mysql:8.0
    container_name: ecotrack-mysql-prod
    mem_limit: 320m
    mem_reservation: 160m
    command:
      - --mysqlx=0
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --performance_schema=OFF
      - --max-connections=30
      - --table-open-cache=128
      - --tmp-table-size=8M
      - --max-heap-table-size=8M
      - --thread-cache-size=4
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./back/ecotrack-office/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - ecotrack-prod-network

  backend:
    build:
      context: ./back/ecotrack-office
      dockerfile: Dockerfile
    container_name: ecotrack-backend-prod
    mem_limit: 420m
    mem_reservation: 220m
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JAVA_TOOL_OPTIONS: >-
        -Xms96m
        -Xmx192m
        -XX:MaxMetaspaceSize=96m
        -XX:MaxDirectMemorySize=32m
        -XX:+UseSerialGC
        -XX:+HeapDumpOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-4}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${HIKARI_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${HIKARI_CONNECTION_TIMEOUT:-30000}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      MANAGEMENT_HEALTH_DB_ENABLED: "false"
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - ecotrack-prod-network

networks:
  ecotrack-prod-network:
    driver: bridge

volumes:
  mysql_prod_data:
    driver: local
