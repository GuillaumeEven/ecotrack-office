<!-- Home admin wireframe (renamed from dashboard-admin) -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home Admin — Eco-Track</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="container">
    <header class="header spaced">
      <div style="display:flex;gap:8px;align-items:center">
        <a class="btn" href="#">Inicio</a>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <a class="btn" href="#">Notificaciones</a>
        <a class="btn" href="#">Perfil</a>
        <a class="btn" href="#">Desconectar</a>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav class="nav">
          <a href="#">Salas</a>
          <a href="#">Reservas</a>
          <a href="#">Incidencias</a>
          <a href="#">Empresa</a>
        </nav>
      </aside>

      <main>
        <section class="card" style="min-height:520px">
          <h4>Mapa de la planta actual</h4>
          <div style="height:460px;background:var(--frame);border-radius:8px;display:flex;align-items:center;justify-content:center">
            <div style="width:90%;height:420px;background:white;border:1px dashed var(--accent);border-radius:6px;display:flex;flex-wrap:wrap;gap:12px;padding:14px;align-content:flex-start">
              <!-- Placeholder boxes representing rooms/puestos -->
              <div style="width:30%;height:90px;background:var(--frame);border-radius:6px"></div>
              <div style="width:30%;height:90px;background:var(--frame);border-radius:6px"></div>
              <div style="width:30%;height:90px;background:var(--frame);border-radius:6px"></div>
              <div style="width:48%;height:120px;background:var(--frame);border-radius:6px"></div>
              <div style="width:48%;height:120px;background:var(--frame);border-radius:6px"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="footer">Wireframe — Home Admin</div>
  </div>
</body>
</html>
