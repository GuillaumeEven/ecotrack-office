<!-- Admin dashboard wireframe: code in English, UI in Spanish -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel de administración — Eco-Track</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title">Panel de administración</div>
      <a class="btn" href="../index.html">Volver al índice</a>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav class="nav">
          <a href="#">Usuarios</a>
          <a href="#">Rutas</a>
          <a href="#">Estadísticas</a>
          <a href="#">Ajustes</a>
        </nav>
      </aside>

      <main>
        <section class="kpi-row">
          <div class="kpi">
            <div class="muted">Usuarios</div>
            <div style="font-size:1.3rem;font-weight:600">1,234</div>
          </div>
          <div class="kpi">
            <div class="muted">Rutas activas</div>
            <div style="font-size:1.3rem;font-weight:600">128</div>
          </div>
          <div class="kpi">
            <div class="muted">Impacto CO2</div>
            <div style="font-size:1.3rem;font-weight:600">-12%</div>
          </div>
        </section>

        <section class="card" style="margin-top:16px">
          <h4>Últimas rutas</h4>
          <table class="table">
            <thead>
              <tr><th>Ruta</th><th>Conductor</th><th>Estado</th><th>Km</th></tr>
            </thead>
            <tbody>
              <tr><td>Ruta 42</td><td>María</td><td>Completada</td><td>12.4</td></tr>
              <tr><td>Ruta 11</td><td>Carlos</td><td>En curso</td><td>8.1</td></tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <div class="footer">Wireframe — Panel de administración</div>
  </div>
</body>
</html>
