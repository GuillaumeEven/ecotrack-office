<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <title>Floor 3 — Main wing</title>
  <rect x="0" y="0" width="1200" height="700" fill="#0b1220" stroke="#0b1220"/>

  <!-- Rooms and corridors -->
  <g id="rooms">
    <rect x="40" y="40" width="520" height="300" rx="8" fill="#0f1724" stroke="#1f2a37"></rect>
    <text x="60" y="72" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#e6eef6" font-weight="600">Open Office — Zone A</text>

    <rect x="40" y="360" width="520" height="280" rx="8" fill="#0f1724" stroke="#2b2626"></rect>
    <text x="60" y="392" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#e6eef6" font-weight="600">Open Office — Zone B</text>

    <rect x="620" y="40" width="520" height="600" rx="8" fill="#0f1724" stroke="#22303b"></rect>
    <text x="640" y="72" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#e6eef6" font-weight="600">Meeting &amp; Quiet — Zone C</text>
  </g>

  <!-- zone heat overlays -->
  <g id="zone-heat">
    <rect x="40" y="40" width="520" height="300" fill="#07210d" opacity="0.5"></rect>
    <rect x="40" y="360" width="520" height="280" fill="#2a1809" opacity="0.35"></rect>
    <rect x="620" y="40" width="520" height="600" fill="#081826" opacity="0.25"></rect>
  </g>

  <!-- Desks: rounded rectangles with small monitor icon -->
  <g id="desks">
    <g class="desk available" id="desk-1" transform="translate(120,110)" data-name="Desk 1A" data-zone="Zone A" data-amenities="Monitor,Window">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#27ae60" stroke="#0b1220" stroke-width="1"></rect>
      <rect x="-10" y="-6" width="20" height="12" class="monitor" fill="#e6eef6"></rect>
    </g>

    <g class="desk reserved" id="desk-2" transform="translate(260,200)" data-name="Desk 2B" data-zone="Zone A" data-amenities="Standing">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#ffb74d" stroke="#0b1220" stroke-width="1"></rect>
      <rect x="-10" y="-6" width="20" height="12" class="monitor" fill="#0b1220"></rect>
    </g>

    <g class="desk occupied" id="desk-3" transform="translate(200,360)" data-name="Desk 3C" data-zone="Zone A" data-amenities="Monitor">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#e74c3c" stroke="#0b1220" stroke-width="1"></rect>
      <rect x="-10" y="-6" width="20" height="12" class="monitor" fill="#e6eef6"></rect>
    </g>

    <g class="desk available" id="desk-4" transform="translate(720,120)" data-name="Desk 4B" data-zone="Zone C" data-amenities="Window">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#4CAF50" stroke="#fff" stroke-width="1"></rect>
      <rect x="-10" y="-6" width="20" height="12" class="monitor" fill="#263238"></rect>
    </g>

    <g class="desk available" id="desk-5" transform="translate(900,340)" data-name="Desk 5D" data-zone="Zone C" data-amenities="Monitor">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#4CAF50" stroke="#fff" stroke-width="1"></rect>
      <rect x="-10" y="-6" width="20" height="12" class="monitor" fill="#263238"></rect>
    </g>

    <g class="desk available" id="desk-6" transform="translate(420,120)" data-name="Desk 6E" data-zone="Zone A" data-amenities="Monitor">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#4CAF50" stroke="#fff" stroke-width="1"></rect>
      <rect x="-10" y="-6" width="20" height="12" class="monitor" fill="#263238"></rect>
    </g>

    <g class="desk reserved" id="desk-7" transform="translate(480,420)" data-name="Desk 7F" data-zone="Zone B" data-amenities="Standing">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#FFA726" stroke="#fff" stroke-width="1"></rect>
      <rect x="-10" y="-6" width="20" height="12" class="monitor" fill="#263238"></rect>
    </g>

    <g class="desk occupied" id="desk-8" transform="translate(780,240)" data-name="Desk 8G" data-zone="Zone C" data-amenities="Monitor,Window">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#EF5350" stroke="#fff" stroke-width="1"></rect>
      <rect x="-10" y="-6" width="20" height="12" class="monitor" fill="#263238"></rect>
    </g>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(920,520)">
    <rect x="0" y="0" width="250" height="120" rx="8" fill="#0f1724" stroke="#1b2733"></rect>
    <text x="16" y="24" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#e6eef6" font-weight="600">Legend</text>
    <g transform="translate(16,36)">
      <rect x="0" y="0" width="18" height="12" fill="#27ae60"></rect>
      <text x="26" y="11" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#cfe6d6">Available</text>
    </g>
    <g transform="translate(16,56)">
      <rect x="0" y="0" width="18" height="12" fill="#ffb74d"></rect>
      <text x="26" y="11" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#ffe7c9">Reserved</text>
    </g>
    <g transform="translate(16,76)">
      <rect x="0" y="0" width="18" height="12" fill="#e74c3c"></rect>
      <text x="26" y="11" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#ffd6cf">Occupied</text>
    </g>
  </g>

  <text x="60" y="30" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="18" fill="#e6eef6" font-weight="700">Floor 3 — Main wing</text>
</svg>
