<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EcoTrack — Pages Index</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="topbar"><div class="brand">EcoTrack Office (Pages)</div>
    <button id="theme-toggle-btn" aria-label="Switch theme" style="margin-left:auto;padding:6px 10px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer">🌓</button>
  </header>
  <main style="padding:20px;">
    <h2>Prototype pages</h2>
    <p>Click a tile to open the page. Previews shown as thumbnails.</p>
    <div class="preview-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;">
      <a href="login.html" class="tile" style="text-decoration:none;color:inherit;">
        <img src="../svg/login-preview.svg" alt="login" style="width:100%;border-radius:6px;border:1px solid #eee;">
        <div style="padding:8px 4px;">Login</div>
      </a>
      <a href="register.html" class="tile" style="text-decoration:none;color:inherit;">
        <img src="../svg/register-preview.svg" alt="register" style="width:100%;border-radius:6px;border:1px solid #eee;">
        <div style="padding:8px 4px;">Register</div>
      </a>
      <a href="profile.html" class="tile" style="text-decoration:none;color:inherit;">
        <img src="../svg/profile-preview.svg" alt="profile" style="width:100%;border-radius:6px;border:1px solid #eee;">
        <div style="padding:8px 4px;">Profile</div>
      </a>
      <a href="floormap.html" class="tile" style="text-decoration:none;color:inherit;">
        <img src="../svg/floor3-mainwing.svg" alt="floor map" style="width:100%;border-radius:6px;border:1px solid #eee;">
        <div style="padding:8px 4px;">Floor Map</div>
      </a>
      <a href="booking.html" class="tile" style="text-decoration:none;color:inherit;">
        <img src="../svg/booking-preview.svg" alt="booking" style="width:100%;border-radius:6px;border:1px solid #eee;">
        <div style="padding:8px 4px;">Booking</div>
      </a>
      <a href="incident.html" class="tile" style="text-decoration:none;color:inherit;">
        <img src="../svg/incident-preview.svg" alt="incident" style="width:100%;border-radius:6px;border:1px solid #eee;">
        <div style="padding:8px 4px;">Report Incident</div>
      </a>
      <a href="admin-dashboard.html" class="tile" style="text-decoration:none;color:inherit;">
        <img src="../svg/admin-preview.svg" alt="admin" style="width:100%;border-radius:6px;border:1px solid #eee;">
        <div style="padding:8px 4px;">Admin Dashboard</div>
      </a>
    </div>
</main>
  <script src="../theme-toggle.js"></script>
</body>
</html>
