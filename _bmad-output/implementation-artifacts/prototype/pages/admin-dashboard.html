<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard — EcoTrack</title>
  <link rel="stylesheet" href="../styles.css">
  <script>/* set theme early to avoid flash */(function(){try{var t=localStorage.getItem('ecotrack-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <header class="topbar"><div class="brand">EcoTrack Admin</div><button id="theme-toggle-btn" aria-label="Switch theme" style="margin-left:auto;padding:6px 10px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer">🌓</button></header>
  <main style="padding:24px;max-width:1000px;margin:24px auto;">
    <h1>Dashboard</h1>
    <div style="display:flex;gap:12px;margin-bottom:12px;">
      <div style="background:#fff;padding:12px;border-radius:8px;flex:1;">Occupancy: <strong>78%</strong></div>
      <div style="background:#fff;padding:12px;border-radius:8px;flex:1;">Ghost rate: <strong>3%</strong></div>
      <div style="background:#fff;padding:12px;border-radius:8px;flex:1;">Open incidents: <strong>2</strong></div>
    </div>
    <p><a href="floormap.html">Open floor map</a></p>
  </main>
  <script src="../theme-toggle.js"></script>
</body>
</html>
