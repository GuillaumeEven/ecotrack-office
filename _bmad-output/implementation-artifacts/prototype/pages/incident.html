<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Report Incident — EcoTrack</title>
  <link rel="stylesheet" href="../styles.css">
  <script>/* set theme early to avoid flash */(function(){try{var t=localStorage.getItem('ecotrack-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <header class="topbar"><div class="brand">EcoTrack Office — Report</div><button id="theme-toggle-btn" aria-label="Switch theme" style="margin-left:auto;padding:6px 10px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer">🌓</button></header>
  <main style="padding:24px;max-width:720px;margin:24px auto;">
    <h1>Report an issue</h1>
    <form>
      <label>Resource
        <select style="width:100%;padding:8px;margin-top:6px;"><option>Desk 4B</option><option>Meeting Room B</option></select>
      </label>
      <label style="display:block;margin-top:12px;">Description
        <textarea style="width:100%;padding:8px;margin-top:6px;" rows="4"></textarea>
      </label>
      <label style="display:block;margin-top:12px;">Attach photo
        <input type="file">
      </label>
      <div style="margin-top:14px;display:flex;gap:8px;">
        <button class="primary" type="button">Submit</button>
        <a href="floormap.html">Back to map</a>
      </div>
    </form>
  </main>
  <script src="../theme-toggle.js"></script>
</body>
</html>
