<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoTrack Office — Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">EcoTrack Office</div>
    <div class="actions">Search • Avatar</div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h3>Floor</h3>
      <select id="floor-select">
        <option>Floor 3</option>
        <option>Floor 2</option>
      </select>
      <h4>Filters</h4>
      <div class="chips">
        <button class="chip">Window</button>
        <button class="chip">Monitor</button>
        <button class="chip">Standing</button>
      </div>
    </aside>

    <main class="main">
      <div class="map-area">
        <svg id="floor-svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
          <rect x="0" y="0" width="1200" height="700" fill="#f6fbf8" stroke="#e6efe8"/>

          <!-- Rooms and corridors -->
          <g id="rooms">
            <rect x="40" y="40" width="520" height="300" rx="8" fill="#ffffff" stroke="#cfeadf"></rect>
            <text x="60" y="72" class="room-label">Open Office — Zone A</text>

            <rect x="40" y="360" width="520" height="280" rx="8" fill="#ffffff" stroke="#fbe9df"></rect>
            <text x="60" y="392" class="room-label">Open Office — Zone B</text>

            <rect x="620" y="40" width="520" height="600" rx="8" fill="#ffffff" stroke="#e8f3fb"></rect>
            <text x="640" y="72" class="room-label">Meeting & Quiet — Zone C</text>
          </g>

          <!-- zone heat overlays -->
          <g id="zone-heat">
            <rect x="40" y="40" width="520" height="300" fill="#e8f5e9" opacity="0.5"></rect>
            <rect x="40" y="360" width="520" height="280" fill="#fff3e0" opacity="0.35"></rect>
            <rect x="620" y="40" width="520" height="600" fill="#e3f2fd" opacity="0.28"></rect>
          </g>

          <!-- Desks: rounded rectangles with small monitor icon -->
          <g id="desks">
            <g class="desk available" id="desk-1" transform="translate(120,110)" data-name="Desk 1A" data-zone="Zone A" data-amenities="Monitor,Window">
              <rect x="-22" y="-12" width="44" height="24" rx="4"></rect>
              <rect x="-10" y="-6" width="20" height="12" class="monitor"></rect>
            </g>

            <g class="desk reserved" id="desk-2" transform="translate(260,200)" data-name="Desk 2B" data-zone="Zone A" data-amenities="Standing">
              <rect x="-22" y="-12" width="44" height="24" rx="4"></rect>
              <rect x="-10" y="-6" width="20" height="12" class="monitor"></rect>
            </g>

            <g class="desk occupied" id="desk-3" transform="translate(200,360)" data-name="Desk 3C" data-zone="Zone A" data-amenities="Monitor">
              <rect x="-22" y="-12" width="44" height="24" rx="4"></rect>
              <rect x="-10" y="-6" width="20" height="12" class="monitor"></rect>
            </g>

            <g class="desk available" id="desk-4" transform="translate(720,120)" data-name="Desk 4B" data-zone="Zone C" data-amenities="Window">
              <rect x="-22" y="-12" width="44" height="24" rx="4"></rect>
              <rect x="-10" y="-6" width="20" height="12" class="monitor"></rect>
            </g>

            <g class="desk available" id="desk-5" transform="translate(900,340)" data-name="Desk 5D" data-zone="Zone C" data-amenities="Monitor">
              <rect x="-22" y="-12" width="44" height="24" rx="4"></rect>
              <rect x="-10" y="-6" width="20" height="12" class="monitor"></rect>
            </g>

            <g class="desk available" id="desk-6" transform="translate(420,120)" data-name="Desk 6E" data-zone="Zone A" data-amenities="Monitor">
              <rect x="-22" y="-12" width="44" height="24" rx="4"></rect>
              <rect x="-10" y="-6" width="20" height="12" class="monitor"></rect>
            </g>

            <g class="desk reserved" id="desk-7" transform="translate(480,420)" data-name="Desk 7F" data-zone="Zone B" data-amenities="Standing">
              <rect x="-22" y="-12" width="44" height="24" rx="4"></rect>
              <rect x="-10" y="-6" width="20" height="12" class="monitor"></rect>
            </g>

            <g class="desk occupied" id="desk-8" transform="translate(780,240)" data-name="Desk 8G" data-zone="Zone C" data-amenities="Monitor,Window">
              <rect x="-22" y="-12" width="44" height="24" rx="4"></rect>
              <rect x="-10" y="-6" width="20" height="12" class="monitor"></rect>
            </g>
          </g>

          <!-- Legend -->
          <g id="legend" transform="translate(920,520)">
            <rect x="0" y="0" width="250" height="120" rx="8" fill="#ffffff" stroke="#eee"></rect>
            <text x="16" y="24" class="legend-title">Legend</text>
            <g transform="translate(16,36)">
              <rect x="0" y="0" width="18" height="12" fill="#4CAF50"></rect>
              <text x="26" y="11" class="legend-label">Available</text>
            </g>
            <g transform="translate(16,56)">
              <rect x="0" y="0" width="18" height="12" fill="#FFA726"></rect>
              <text x="26" y="11" class="legend-label">Reserved</text>
            </g>
            <g transform="translate(16,76)">
              <rect x="0" y="0" width="18" height="12" fill="#EF5350"></rect>
              <text x="26" y="11" class="legend-label">Occupied</text>
            </g>
          </g>

          <!-- Title -->
          <text x="60" y="30" class="floor-title">Floor 3 — Main wing</text>
        </svg>
      </div>

      <div class="statusbar">Status: Live (prototype) • polling 30s • <button id="quick-book">Quick Book</button></div>
    </main>
  </div>

  <!-- Booking bottom sheet -->
  <div id="booking-drawer" class="drawer hidden" role="dialog" aria-hidden="true">
    <div class="drawer-header">
      <div id="drawer-title">Desk</div>
      <button id="close-drawer">✕</button>
    </div>
    <div class="drawer-body">
      <div id="drawer-info"></div>
      <label>Date: <input type="date" id="booking-date"></label>
      <label>Time: <select id="booking-time"><option>09:00–18:00</option></select></label>
      <textarea id="booking-note" placeholder="Optional note"></textarea>
    </div>
    <div class="drawer-actions">
      <button id="reserve-btn" class="primary">Reserve</button>
      <button id="cancel-btn">Cancel</button>
    </div>
  </div>

  <!-- Check-in confirmation overlay (for magic-link simulation) -->
  <div id="checkin-screen" class="overlay hidden">
    <div class="checkin-card">
      <div class="checkmark">✓</div>
      <h2 id="checkin-title">Checked in</h2>
      <p id="checkin-desc">You are checked in at Desk</p>
      <button id="back-to-map">Return to map</button>
    </div>
  </div>

  <div id="snackbar" class="snackbar hidden"></div>

  <script src="app.js"></script>
</body>
</html>
