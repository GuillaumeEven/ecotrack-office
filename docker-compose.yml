services:
  # ============================================================================
  # MySQL Database
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: ecotrack-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ecotrack}
      MYSQL_USER: ${DB_USERNAME:-ecotrack_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecotrack_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      # Init database with schema
      - ./back/ecotrack-office/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Persist data
      - mysql_data:/var/lib/mysql
    networks:
      - ecotrack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # Spring Boot Backend (runtime profile configurable)
  # ============================================================================
  backend:
    build:
      context: ./back/ecotrack-office
      dockerfile: Dockerfile
    container_name: ecotrack-backend
    environment:
      # Database configuration
      DB_USERNAME: ${DB_USERNAME:-ecotrack_user}
      DB_PASSWORD: ${DB_PASSWORD:-ecotrack_password}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-ecotrack}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

      # Spring configuration
      # Local default is dev for seeded data; deployment overrides to prod.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080

      # JWT configuration (required)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      # API configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:4200,http://frontend:8080}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecotrack-network
    healthcheck:
      test: ["CMD-SHELL", "code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/health || true); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ] || [ \"$$code\" = \"403\" ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ============================================================================
  # Angular Frontend (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./front/ecotrack-office
      dockerfile: Dockerfile
    container_name: ecotrack-frontend
    environment:
      ANGULAR_API_URL: ${ANGULAR_API_URL:-http://localhost:8080/api}
      API_BASE_URL: ${API_BASE_URL:-http://backend:8080/api}
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:8080"
    depends_on:
      - backend
    networks:
      - ecotrack-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ============================================================================
# Networks
# ============================================================================
networks:
  ecotrack-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  mysql_data:
    driver: local
